services:
  droplink:
    build:
      context: .
      # 部分服务器 buildkit 桥接网络不通，用宿主机网络构建
      network: host
      args:
        # 国内服务器可在 .env 设置 NPM_REGISTRY=https://registry.npmmirror.com/
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: droplink
    restart: unless-stopped
    ports:
      # 宿主端口可在 .env 用 HOST_PORT 覆盖
      - "${HOST_PORT:-3000}:3000"
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:?请在同目录 .env 文件中设置 ACCESS_TOKEN 口令}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
    volumes:
      - ./data:/app/data
